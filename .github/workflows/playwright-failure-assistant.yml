name: Playwright Failure Assistant

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "playwright-bug-report-assistant/**"
      - ".github/workflows/playwright-failure-assistant.yml"
  push:
    branches: [main]
    paths:
      - "playwright-bug-report-assistant/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: playwright-bug-report-assistant

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-bug-report-assistant/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-analysis-artifacts-${{ github.run_id }}
          path: playwright-bug-report-assistant/test-results/
          if-no-files-found: ignore
          retention-days: 14
